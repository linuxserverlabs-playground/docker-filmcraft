# The manifest for docker-filmcraft. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: filmcraft

summary: |-
  [FilmCraft](https://getartcraft.com/apps/filmcraft): an open-source, nonlinear video editor written by scratch in pure Rust.

maintainers:
- thelamer

upstream:
  url: 'https://getartcraft.com/apps/filmcraft'
  version:
    type: github_release
    repo: storytold/filmcraft
    require_assets:
    - asset: '^filmcraft\-.*\-linux\-x86_64\.deb$'
    - asset: '^filmcraft\-.*\-linux\-aarch64\.deb$'
  notes:
    type: github_release
    repo: storytold/filmcraft

release:
  branch: main
  tag: latest
  channel: stable

build:
  base: selkies
  version_arg: FILMCRAFT_RELEASE
  platforms:
  - amd64
  - arm64

test:
  startup_timeout: 120
  web:
    port: 3001
    scheme: https
    auth: user:password
    screenshot_delay: 30

runtime:
  ports:
  - internal: '3000'
    description: 'FilmCraft desktop gui HTTP, must be proxied.'
  - internal: '3001'
    description: FilmCraft desktop gui HTTPS.
  volumes:
  - path: /config
    host_path: /path/to/filmcraft/config
    description: 'Users home directory in the container, stores local files and settings'
  custom:
  - flag: shm-size
    compose: shm_size
    value: 1gb
    description: Recommended for all desktop images.

docs:
  categories:
  - Video Editor
  logo: https://raw.githubusercontent.com/storytold/filmcraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.filmcraft.png
  setup: |-
    The application can be accessed at:

    * https://yourhost:3001/

    Open https://yourhost:3001/ (selkies, user and password from CUSTOM_USER/PASSWORD). FilmCraft opens full screen on an empty project; import a clip and drop it on the timeline. Working means the timeline plays back in the preview.
  notices:
    strict_proxy: true
    selkies:
      enabled: true
      nvidia: true

proxy:
  port: 3001
  scheme: https
  subdomain: true
  subfolder:
    supported: false

changelog:
- date: '2026-11-02'
  text: Initial release.
